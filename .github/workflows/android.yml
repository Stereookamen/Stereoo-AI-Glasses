name: LiveKit BV200 Background Voice v2 APK

on:
  push:
    branches:
      - pilot/livekit-bv200-background-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build LiveKit BV200 Android APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Stereoo-LiveKit-BV200-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
