name: Unpack project and build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project ZIP
        run: |
          mkdir -p extracted
          unzip -o Stereoo-AI-Glasses-ready-project-fixed-1.zip -d extracted
          find extracted -maxdepth 4 -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd extracted
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stereoo-AI-Glasses-ready
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
